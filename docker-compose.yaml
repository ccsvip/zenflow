# 端口/环境变量统一来自 .env（与 .env.example 对齐）
# 启动：docker compose up -d --build
# 停止：docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: task-flow-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-flow-web:latest
    container_name: task-flow-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Next.js 在 standalone 模式下读取 PORT / HOSTNAME
      PORT: ${WEB_CONTAINER_PORT}
      HOSTNAME: ${HOSTNAME}
      NODE_ENV: ${NODE_ENV}
      # 数据库连接环境变量
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      # 严格使用 .env 中的端口变量，禁止硬编码
      - "${WEB_PORT}:${WEB_CONTAINER_PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:${WEB_CONTAINER_PORT}/ >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
